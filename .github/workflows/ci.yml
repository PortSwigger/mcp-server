name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Reject unwanted files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Look for exposed usernames and unwanted files
        run: |
          bash scripts/check-unwanted.sh --self-test
          bash scripts/check-unwanted.sh

  build:
    name: Test & Build
    needs: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true

      - name: Run tests
        run: ./gradlew test

      - name: Build extension JAR
        run: ./gradlew embedProxyJar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Upload extension JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burp-mcp-all
          path: build/libs/burp-mcp-all-v*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish extension JAR
    needs: build
    if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'dependabot/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download extension JAR
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: burp-mcp-all
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [[ -z "$version" ]]; then
            echo "Could not read the Gradle project version." >&2
            exit 1
          fi
          jar="release/burp-mcp-all-v${version}.jar"
          if [[ ! -f "$jar" ]]; then
            echo "Built JAR was not found in the downloaded artifact." >&2
            find release -type f -print >&2
            exit 1
          fi
          short="${GITHUB_SHA::7}"
          tag="build-${GITHUB_SHA}"
          checksum=$(sha256sum "$jar" | awk '{print $1}')
          notes_file=$(mktemp)
          {
            echo "Download \`burp-mcp-all-v${version}.jar\` and load it in Burp Suite."
            echo
            echo "1. Open Extensions, then Add."
            echo "2. Set the extension type to Java."
            echo "3. Select \`burp-mcp-all-v${version}.jar\`."
            echo
            echo "Do not install \`libs/mcp-proxy-all.jar\` as a Burp extension."
            echo
            echo "- Version label: ${version}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- SHA-256: ${checksum}"
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" \
              --target "$GITHUB_SHA" \
              --title "Burp MCP Server v${version} (${short})" \
              --notes-file "$notes_file" \
              --latest
          fi

  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
